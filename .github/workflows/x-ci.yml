name: x-ci
# Build and test on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: x-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Fork hooks present
        run: python3 -I -B scripts/apply-hooks.py --check
      - id: build
        uses: ./.github/actions/build-x
        with:
          build-type: debug
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wgtunnelx-debug
          path: ${{ steps.build.outputs.apk-dir }}/*.apk
          retention-days: 7
