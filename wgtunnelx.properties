# WG Tunnel X fork identity. Read by app/wgtunnelx.gradle.kts.
applicationId=com.wgtunnelx.android
appName=WG Tunnel X
providerAuthority=wgtunnelx.provider
# GitHub repository the standalone build checks for updates
updateRepository=bkaganovich-stack/wgtunnelx
# Fork revision on top of the upstream version: versionName = <upstream>-x.<revision>,
# versionCode = <upstream versionCode> * 100 + <revision>. Reset to 1 by CI on every upstream release.
xRevision=1
